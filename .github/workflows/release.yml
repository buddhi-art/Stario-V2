name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.16)'
        required: false
        default: ''

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_NAME=$(./gradlew -q :app:getVersionName)
            TAG="v${VERSION_NAME}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Sign & Prepare Release APKs
        id: prepare_release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          trap 'rm -f release.keystore release_assets/aligned.apk' EXIT

          mkdir -p release_assets

          # 1. Copy Debug APK (signed with standard debug keystore)
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/Stario-${TAG}-debug.apk"

          # 2. Copy Raw Unsigned Release APK
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release_assets/Stario-${TAG}-unsigned.apk"

          # 3. Require persistent signing secrets before producing Stario-<TAG>.apk.
          # Never fall back to an ephemeral keytool-generated keystore, which breaks in-place upgrades.
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
              echo "::error::KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD is missing."
              exit 1
            fi

            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            chmod 600 release.keystore

            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
              app/build/outputs/apk/release/app-release-unsigned.apk \
              release_assets/aligned.apk

            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "release_assets/Stario-${TAG}.apk" \
              release_assets/aligned.apk

            "$BUILD_TOOLS_DIR/apksigner" verify -v "release_assets/Stario-${TAG}.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Repository signing secret KEYSTORE_BASE64 is not configured; skipping signed Stario-${TAG}.apk instead of generating an upgrade-breaking ephemeral keystore."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Stario ${TAG} Release"
            echo ""
            echo "### ✨ What's New & Highlights"
            echo "* **Fluid Physical Motion**: VSYNC-synchronized \`SpringAnimation\` engines, hyperbolic rubber-banding overscroll, fling velocity handoff, and smooth \`ArcMotion\` trajectories."
            echo "* **Ultra-Smooth 120Hz & Zero Battery Waste**: Lifecycle-scoped sensor/redraw loops in \`StylizedClockView\`, \`PulsingTextView\`, and \`Media\`, with bounded background thread pools and ViewHolder recycling."
            echo "* **Stability & Memory Hardening**: Observer lifecycle cleanup in \`Measurements\` & \`ObservableObject\`, TimSort-compliant comparators in \`CategoryMappings\`, and thread-safe app/profile state."
            echo "* **Icon-Anchored Transitions & Optional Root Mode**: Icon-anchored \`makeScaleUpAnimation\` + Landmark Return Morph, plus optional Root / Privileged Mode in Settings for root screen lock and Magisk/KernelSU/APatch priv-app systemization."
            echo ""
            echo "---"
            echo "### 📦 Download & Installation"
            if [ -f "release_assets/Stario-${TAG}.apk" ]; then
              echo "* **\`Stario-${TAG}.apk\`**: Recommended signed release build. Directly installable on Android 10+ (API 29+)."
            else
              echo "> **Note:** Signed \`Stario-${TAG}.apk\` was omitted because repository signing secrets (\`KEYSTORE_BASE64\`) are not configured (ephemeral throwaway keystores are disabled to protect in-place upgrades)."
            fi
            echo "* **\`Stario-${TAG}-debug.apk\`**: Debug build with debugging symbols enabled."
            echo "* **\`Stario-${TAG}-unsigned.apk\`**: Pure unsigned release APK for custom signing or verification."
          } > release_body.md

          echo "Listing release assets:"
          ls -lh release_assets/

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: stario-${{ env.TAG }}-apks
          path: release_assets/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Stario ${{ env.TAG }}"
          files: release_assets/*
          body_path: release_body.md
          draft: false
          prerelease: false
